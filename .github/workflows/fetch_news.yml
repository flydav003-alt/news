name: fetch-news

on:
  schedule:
    # 台灣時間 07:00–23:00 每小時一次（GitHub 用 UTC：23 點＋0~15 點）
    - cron: "0 23,0-15 * * *"
  workflow_dispatch:      # 允許手動按「Run workflow」測試

permissions:
  contents: write         # 要把 news.json 推回 data 分支

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取出程式碼（main）
        uses: actions/checkout@v4

      - name: 取出 data 分支（沒有的話會是空資料夾）
        run: |
          mkdir -p data_out
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git --work-tree=data_out checkout origin/data -- news.json || true
            git reset -q
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-actions.txt

      - name: 安裝套件
        run: pip install -r requirements-actions.txt

      - name: 抓新聞 → AI 分析 → 翻譯 → 輸出 news.json
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}   # 第二個帳號的金鑰；沒設定也沒關係
          MAX_AI: "20"             # 總名額；其中 4 個留給 AI 專區技術摘要，財經維持 16
          AI_TECH_SLOTS: "4"
        run: python scheduler.py data_out/news.json

      - name: 推到 data 分支（只保留 1 個 commit，不會讓 repo 變肥）
        run: |
          cd data_out
          git init -q -b data
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git commit -q -m "news $(date -u +%Y-%m-%dT%H:%MZ)"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin data

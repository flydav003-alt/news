name: fetch-news

on:
  schedule:
    # GitHub 的排程是「盡力而為」：整點（:00）最塞，常延遲數十分鐘甚至整次被跳過。
    # 所以 ① 避開 :00 / :30，改用 :11 / :41；② 頻率比需求高一倍，漏一次也不會斷檔。
    # 台灣 07:00–23:59 每 30 分鐘一次（UTC 23 點＋0~15 點）
    - cron: "11,41 23,0-15 * * *"
    # 台灣 00:00–06:59 每 2 小時一次（UTC 16/18/20/22 點 = 台灣 0/2/4/6 點；美股盤中也有新聞）
    - cron: "11 16,18,20,22 * * *"
  workflow_dispatch:      # 允許手動按「Run workflow」測試

permissions:
  contents: write         # 要把 news.json 推回 data 分支

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取出程式碼（main）
        uses: actions/checkout@v4

      - name: 取出 data 分支（沒有的話會是空資料夾）
        run: |
          mkdir -p data_out
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            # 逐一取出：其中一個檔案還不存在（例如第一次跑）不會連累其他檔案
            for f in news.json extras.json health.json; do
              git --work-tree=data_out checkout origin/data -- "$f" || true
            done
            git reset -q
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-actions.txt

      - name: 安裝套件
        run: pip install -r requirements-actions.txt

      - name: 抓新聞 → AI 分析 → 翻譯 → 輸出 news.json
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}   # 第二個帳號的金鑰；沒設定也沒關係
          MAX_AI: "10"             # 每次的名額（頻率變 2 倍，所以每次減半，整天總量與以前相近）；其中 2 個留給 AI 專區技術摘要
          AI_TECH_SLOTS: "2"
        run: python scheduler.py data_out/news.json

      - name: 籌碼 / 行事曆 / 社群 → extras.json（失敗也不影響新聞）
        continue-on-error: true
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}                          # Cloudflare Worker 網址（繞過 PTT / 微博 / Reddit / BLS 擋雲端 IP）
          PROXY_KEY: ${{ secrets.PROXY_KEY }}                          # Worker 的通關密碼
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}                    # 選填：非農 / CPI 日期更穩（沒有就改抓 BLS 官網）
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}    # 選填：沒設定時 Threads 區塊會顯示未設定
          EXTRAS_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}   # 手動按 Run workflow 時強制全部重抓
        run: python extras.py data_out/extras.json

      - name: 推到 data 分支（只保留 1 個 commit，不會讓 repo 變肥）
        run: |
          cd data_out
          git init -q -b data
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "news $(date -u +%Y-%m-%dT%H:%MZ)"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin data
